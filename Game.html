
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Hunter RPG</title>
<link rel="stylesheet" href="Game.css">

</head>

<body>

<div id="hud">
  <h2>⚔ SHADOW HUNTER</h2>

  <div>❤️ HP <span id="hpText">100 / 100</span></div>
  <div class="bar">
    <div class="fill" id="health" style="width:100%"></div>
  </div>

  <div>✨ Experience</div>
  <div class="bar">
    <div class="fill" id="xp" style="width:0%"></div>
  </div>

  <div id="stats">
    Level: <span id="level">1</span><br>
    Score: <span id="score">0</span><br>
    Enemies defeated: <span id="kills">0</span>
  </div>

  <div id="powers">Active powers: None</div>
</div>

<div id="bossBar">
  BOSS
  <div class="bar">
    <div id="bossHealth"></div>
  </div>
</div>

<div id="help">
  WASD: Move · Mouse: Aim · Click/Space: Shoot
</div>

<div id="mobileControls">
  <div class="pad">
    <div></div>
    <div class="control" data-key="w">▲</div>
    <div></div>
    <div class="control" data-key="a">◀</div>
    <div class="control" data-key="s">▼</div>
    <div class="control" data-key="d">▶</div>
    <div></div><div></div><div></div>
  </div>
  <div class="actions">
    <div class="control" id="shootButton">FIRE</div>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h1 id="result">GAME OVER</h1>
    <p id="summary"></p>
    <button onclick="restart()">PLAY AGAIN</button>
  </div>
</div>

<canvas id="game"></canvas>
<script src="Game.js"></script>

</body>
</html>
